services:
  - type: web
    name: agora-pm
    env: node
    plan: free
    buildCommand: npm run install:all && npm run prisma:generate && npm run prisma:migrate:deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
